project_name: "HermesWorkbench"
languages:
- typescript
- csharp
encoding: "utf-8"
ignore_all_files_in_gitignore: false
ls_workspace_folders:
- "src"
ls_additional_workspace_folders: []
ignored_paths:
- "src/node_modules/**"
- "src/dist/**"
- "src/**/bin/**"
- "src/**/obj/**"
- "artifacts/**"
- "data/**"
- "logs/**"
- "remote-install/**"
- "source/**"
- "workspace/**"
read_only: false
excluded_tools: []
included_optional_tools: []
fixed_tools: []
initial_prompt: "Work in the Hermes Workbench checkout. Prefer symbol-aware, narrowly scoped changes and preserve the versioned Hermes compatibility boundary."
